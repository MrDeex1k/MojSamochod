name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned NUB
        run: |
          install_dir="$RUNNER_TEMP/moje-auto-nub"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "$install_dir/nub.tar.gz" \
            https://github.com/nubjs/nub/releases/download/v0.9.3/nub-linux-x64.tar.gz
          printf '%s  %s\n' \
            f085a11ed0fa18050d3dad31e676ba3e2f69d6b4a4a35a17cd88077485802cf0 \
            "$install_dir/nub.tar.gz" | sha256sum --check
          tar -xzf "$install_dir/nub.tar.gz" -C "$install_dir"
          ln -s nub "$install_dir/bin/nubx"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: Install dependencies through Socket Firewall
        run: |
          test "$(nub --node --version)" = "v$(cat .node-version)"
          nub run deps:install
      - name: Run repository checks
        run: nub run check
